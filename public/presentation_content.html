# DEFENSE PANEL OPEN QUESTIONS & PREPARED EXPERT ANSWERS

### Question 1: How does your system handle background noise in rural classroom environments?
**Prepared Expert Answer:**
> "Zipformer-30M is a streaming transducer model trained with SpecAugment and noise-augmented audio datasets. Additionally, our mobile recording pipeline applies a local WebRTC noise suppression filter before feeding PCM audio chunks into Sherpa-ONNX, ensuring robust performance under ambient noise."

### Question 2: Why not use a cloud LLM like GPT-4o-audio for reading assessment?
**Prepared Expert Answer:**
> "While cloud LLMs offer high conversational fluency, they fail our fundamental constraints: 1) They require continuous high-speed internet. 2) They incur prohibitive per-request API costs. 3) As shown in Candidate 2 (TextPA), LLMs suffer from severe hallucinations on child speech, whereas Doraebin provides deterministic, zero-cost, offline assessment."

### Question 3: How does the EWMA model prevent historical bias compared to traditional averaging?
**Prepared Expert Answer:**
> "Traditional averaging divides total successes by total attempts (\$M = \\frac{1}{k}\\sum S_i\$), meaning early errors permanently depress the score. EWMA uses a decaying weighting factor (\$M_t = (1-\\alpha)M_{t-1} + \\alpha S_t\$). As \$\\alpha\$ weights recent attempts more heavily, past errors decay exponentially (\$1-\\alpha)^i\$, allowing a student's score to recover rapidly once mastery is achieved."
